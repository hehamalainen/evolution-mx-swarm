[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mx-swarm"
version = "0.1.0"
description = "PRD-to-Shipping Agent Delivery Harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MX Swarm Team"}
]
keywords = ["ai", "agents", "automation", "devops", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.34.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-pubsub>=2.18.0",
    "google-cloud-secret-manager>=2.16.0",
]
azure = [
    "azure-servicebus>=7.11.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-identity>=1.14.0",
]
openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
all = [
    "mx-swarm[gcp,azure,openai,dev]",
]

[project.scripts]
mx = "cli.main:main"

[project.urls]
Homepage = "https://github.com/hehamalainen/Evolution-Coding"
Documentation = "https://github.com/hehamalainen/Evolution-Coding/mx-swarm"
Repository = "https://github.com/hehamalainen/Evolution-Coding"

[tool.setuptools.packages.find]
include = ["shared*", "planner*", "worker*", "judge*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise from None (too many legacy cases)
    "UP042", # preserve (str, Enum) compatibility across schemas
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"shared/utils/config.py" = ["E741"]
"cli/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["shared", "planner", "worker", "judge", "cli"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
